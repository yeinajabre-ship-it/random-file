<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tempat File Kebutuhan</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #000; color: #eee; line-height: 1.6; }
    #bubbles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .content { position: relative; z-index: 1; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 16px; background: rgba(10,10,10,.75); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #1c1c1c; }
    .logo { font-weight: 700; font-size: 1rem; color: #4fc3f7; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .btn { display: inline-block; padding: 9px 18px; background: linear-gradient(135deg, #0288d1, #4fc3f7); color: #000; font-weight: 600; border-radius: 30px; text-decoration: none; border: none; font-size: .9rem; cursor: pointer; text-align: center; }
    .btn:hover { box-shadow: 0 6px 20px rgba(79,195,247,.4); }
    .btn.gray { background: #222; color: #ddd; }
    .btn.red { background: #c62828; color: #fff; }
    .hero { text-align: center; padding: 60px 20px 24px; }
    .hero h1 { font-size: 2rem; margin-bottom: 8px; }
    .hero p { color: #999; }
    #who { font-size: .8rem; color: #4fc3f7; margin-top: 6px; }
    .wrap { max-width: 960px; margin: auto; padding: 0 20px 50px; }
    #search { width: 100%; padding: 14px 18px; border-radius: 30px; border: 1px solid #222; background: rgba(15,15,15,.85); color: #fff; font-size: 1rem; outline: none; }
    #search:focus { border-color: #4fc3f7; }
    .cats { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 24px; justify-content: center; }
    .cat { padding: 8px 18px; border-radius: 20px; border: 1px solid #2a2a2a; background: rgba(20,20,20,.8); color: #ddd; cursor: pointer; }
    .cat.active { background: #4fc3f7; color: #000; border-color: #4fc3f7; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card { background: rgba(20,20,20,.78); backdrop-filter: blur(6px); padding: 18px; border-radius: 16px; border: 1px solid #222; display: flex; flex-direction: column; gap: 6px; }
    .card:hover { border-color: #4fc3f7; }
    .card .icon { font-size: 1.8rem; }
    .card h3 { font-size: 1.05rem; color: #4fc3f7; word-break: break-word; }
    .card p { color: #999; font-size: .88rem; flex: 1; }
    .meta { font-size: .78rem; color: #666; }
    .card .btn { margin-top: 6px; }
    .empty { text-align: center; color: #777; padding: 40px 0; display: none; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
    .modal.show { display: flex; }
    .box { background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 16px; padding: 22px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; }
    .box input, .box textarea, .box select { padding: 12px; border-radius: 10px; border: 1px solid #222; background: #000; color: #fff; font-size: 1rem; outline: none; width: 100%; }
    .box input:focus, .box textarea:focus, .box select:focus { border-color: #4fc3f7; }
    .row { display: flex; gap: 10px; }
    .row .btn { flex: 1; }
    .link { color: #4fc3f7; font-size: .85rem; text-align: center; cursor: pointer; }
    footer { text-align: center; padding: 24px; color: #777; border-top: 1px solid #1c1c1c; }
  </style>
</head>
<body>
  <canvas id="bubbles"></canvas>
  <div class="content">
    <header>
      <div class="logo">📁 Tempat File</div>
      <div class="actions">
        <button class="btn" id="btnUpload" onclick="show('mUpload')" style="display:none">⬆ Upload</button>
        <button class="btn gray" onclick="show('mReq')">Request</button>
        <button class="btn" id="btnLogin" onclick="show('mLogin')">Login</button>
        <button class="btn gray" id="btnLogout" onclick="logout()" style="display:none">Keluar</button>
      </div>
    </header>

    <div class="hero">
      <h1>Tempat File Kebutuhan</h1>
      <p>Cari dan download file yang kamu butuhkan, gratis.</p>
      <div id="who"></div>
    </div>

    <div class="wrap">
      <input type="text" id="search" placeholder="🔍 Cari file...">
      <div class="cats" id="cats"></div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty">File belum ada 😕</div>
    </div>
    <footer>© <span id="year"></span> Tempat File Kebutuhan</footer>
  </div>

  <div class="modal" id="mLogin">
    <form class="box" id="fLogin">
      <h3 id="loginTitle">Login</h3>
      <input type="email" id="lEmail" placeholder="Email" required>
      <input type="password" id="lPass" placeholder="Password (min 6 karakter)" minlength="6" required>
      <div class="row">
        <button type="button" class="btn gray" onclick="hide('mLogin')">Batal</button>
        <button type="submit" class="btn" id="loginBtn">Masuk</button>
      </div>
      <div class="link" id="toggleMode">Belum punya akun? Daftar</div>
    </form>
  </div>

  <div class="modal" id="mUpload">
    <form class="box" id="fUpload">
      <h3>Upload File</h3>
      <input type="text" id="uNama" placeholder="Nama file" required>
      <select id="uKat"></select>
      <textarea id="uDesc" rows="3" placeholder="Deskripsi singkat"></textarea>
      <input type="file" id="uFile" required>
      <div class="meta" id="uStatus"></div>
      <div class="row">
        <button type="button" class="btn gray" onclick="hide('mUpload')">Batal</button>
        <button type="submit" class="btn" id="uBtn">Upload</button>
      </div>
    </form>
  </div>

  <div class="modal" id="mReq">
    <form class="box" id="fReq">
      <h3>Request File</h3>
      <input type="text" id="rNama" placeholder="Nama kamu" required>
      <textarea id="rFile" rows="4" placeholder="File apa yang kamu butuhkan?" required></textarea>
      <div class="row">
        <button type="button" class="btn gray" onclick="hide('mReq')">Batal</button>
        <button type="submit" class="btn">Kirim</button>
      </div>
    </form>
  </div>

  <script>
    // ================== EDIT BAGIAN INI ==================
    const SUPABASE_URL = "https://ekrmvvqirhejouqyfckf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_DwtbIh999C4oZLSanx24Mw_9g1ZIigN";
    const ADMIN_EMAIL = "akukecewaakugppkokk@gmail.com";
    const WA_NUMBER = "628123456789";
    const kategori = ["Semua", "Dokumen", "Aplikasi", "Gambar", "Video", "Lainnya"];
    // =====================================================

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const icons = { Dokumen: "📄", Aplikasi: "📦", Gambar: "🖼️", Video: "🎬", Lainnya: "📁" };
    let aktif = "Semua", daftar = [], user = null, modeDaftar = false;

    const $ = id => document.getElementById(id);
    const show = id => $(id).classList.add("show");
    const hide = id => $(id).classList.remove("show");
    document.querySelectorAll(".modal").forEach(m => m.addEventListener("click", e => { if (e.target === m) m.classList.remove("show"); }));
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const isAdmin = () => user && user.email === ADMIN_EMAIL;
    function fmtSize(b) { return b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB"; }

    function updateUI() {
      $("btnLogin").style.display = user ? "none" : "";
      $("btnLogout").style.display = user ? "" : "none";
      $("btnUpload").style.display = isAdmin() ? "" : "none";
      $("who").textContent = user ? `Login sebagai ${user.email}${isAdmin() ? " (Admin)" : ""}` : "";
      renderFiles();
    }
    sb.auth.onAuthStateChange((_e, session) => { user = session ? session.user : null; updateUI(); });

    $("toggleMode").onclick = () => {
      modeDaftar = !modeDaftar;
      $("loginTitle").textContent = modeDaftar ? "Daftar Akun" : "Login";
      $("loginBtn").textContent = modeDaftar ? "Daftar" : "Masuk";
      $("toggleMode").textContent = modeDaftar ? "Sudah punya akun? Login" : "Belum punya akun? Daftar";
    };
    $("fLogin").addEventListener("submit", async e => {
      e.preventDefault();
      const email = $("lEmail").value, password = $("lPass").value;
      const { error } = modeDaftar
        ? await sb.auth.signUp({ email, password })
        : await sb.auth.signInWithPassword({ email, password });
      if (error) return alert("Gagal: " + error.message);
      e.target.reset(); hide("mLogin");
    });
    async function logout() { await sb.auth.signOut(); }

    async function loadFiles() {
      const { data, error } = await sb.from("files").select("*").order("created_at", { ascending: false });
      if (error) { alert("Gagal memuat file: " + error.message); return; }
      daftar = data; renderFiles();
    }
    function renderCats() {
      $("cats").innerHTML = "";
      kategori.forEach(k => {
        const b = document.createElement("button");
        b.className = "cat" + (k === aktif ? " active" : "");
        b.textContent = k;
        b.onclick = () => { aktif = k; renderCats(); renderFiles(); };
        $("cats").appendChild(b);
      });
    }
    function renderFiles() {
      const q = $("search").value.toLowerCase();
      const hasil = daftar.filter(f =>
        (aktif === "Semua" || f.kategori === aktif) &&
        (f.nama.toLowerCase().includes(q) || (f.deskripsi || "").toLowerCase().includes(q)));
      $("grid").innerHTML = hasil.map(f => {
        const url = sb.storage.from("files").getPublicUrl(f.path, { download: true }).data.publicUrl;
        return `<div class="card">
          <div class="icon">${icons[f.kategori] || "📁"}</div>
          <h3>${esc(f.nama)}</h3>
          <p>${esc(f.deskripsi)}</p>
          <div class="meta">${esc(f.kategori)} • ${esc(f.ukuran)}</div>
          <a class="btn" href="${url}">⬇ Download</a>
          ${isAdmin() ? `<button class="btn red" onclick="hapus(${f.id}, '${esc(f.path)}')">🗑 Hapus</button>` : ""}
        </div>`;
      }).join("");
      $("empty").style.display = hasil.length ? "none" : "block";
    }
    $("search").addEventListener("input", renderFiles);

    $("uKat").innerHTML = kategori.filter(k => k !== "Semua").map(k => `<option>${k}</option>`).join("");
    $("fUpload").addEventListener("submit", async e => {
      e.preventDefault();
      if (!isAdmin()) return alert("Hanya admin yang bisa upload.");
      const file = $("uFile").files[0];
      $("uBtn").disabled = true; $("uStatus").textContent = "Mengupload... tunggu ya";
      const safe = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const path = Date.now() + "-" + safe;
      const up = await sb.storage.from("files").upload(path, file);
      if (up.error) { $("uBtn").disabled = false; $("uStatus").textContent = ""; return alert("Upload gagal: " + up.error.message); }
      const ins = await sb.from("files").insert({
        nama: $("uNama").value, kategori: $("uKat").value,
        deskripsi: $("uDesc").value, ukuran: fmtSize(file.size), path
      });
      $("uBtn").disabled = false; $("uStatus").textContent = "";
      if (ins.error) return alert("Gagal simpan data: " + ins.error.message);
      e.target.reset(); hide("mUpload"); loadFiles();
    });
    async function hapus(id, path) {
      if (!confirm("Hapus file ini?")) return;
      await sb.storage.from("files").remove([path]);
      await sb.from("files").delete().eq("id", id);
      loadFiles();
    }

    $("fReq").addEventListener("submit", e => {
      e.preventDefault();
      const teks = encodeURIComponent(`Halo, saya ${$("rNama").value}. Request file: ${$("rFile").value}`);
      window.open(`https://wa.me/${WA_NUMBER}?text=${teks}`, "_blank");
      e.target.reset(); hide("mReq");
    });

    $("year").textContent = new Date().getFullYear();
    renderCats(); loadFiles();

    const canvas = $("bubbles"), ctx = canvas.getContext("2d");
    let bubbles = [];
    function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
    resize(); addEventListener("resize", resize);
    function createBubble(initial) {
      return { x: Math.random() * canvas.width, y: initial ? Math.random() * canvas.height : canvas.height + 40,
        r: Math.random() * 28 + 6, speed: Math.random() * 0.6 + 0.2, drift: Math.random() * 6.28, alpha: Math.random() * 0.25 + 0.1 };
    }
    for (let i = 0; i < (innerWidth < 600 ? 25 : 50); i++) bubbles.push(createBubble(true));
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      bubbles.forEach((b, i) => {
        b.y -= b.speed; b.drift += 0.01; b.x += Math.sin(b.drift) * 0.4;
        const g = ctx.createRadialGradient(b.x - b.r * .3, b.y - b.r * .3, b.r * .1, b.x, b.y, b.r);
        g.addColorStop(0, `rgba(255,255,255,${b.alpha})`);
        g.addColorStop(.6, `rgba(79,195,247,${b.alpha * .3})`);
        g.addColorStop(1, `rgba(79,195,247,${b.alpha * .1})`);
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = g; ctx.fill();
        ctx.strokeStyle = `rgba(79,195,247,${b.alpha})`; ctx.stroke();
        if (b.y + b.r < 0) bubbles[i] = createBubble(false);
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
