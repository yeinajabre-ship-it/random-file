<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tempat File Kebutuhan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: system-ui, sans-serif; background: #000; color: #eee; line-height: 1.6; }
    #bubbles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .content { position: relative; z-index: 1; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: rgba(10,10,10,.75); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #1c1c1c; }
    .logo { font-weight: 700; font-size: 1.15rem; color: #4fc3f7; }
    .btn { display: inline-block; padding: 10px 22px; background: linear-gradient(135deg, #0288d1, #4fc3f7); color: #000; font-weight: 600; border-radius: 30px; text-decoration: none; border: none; font-size: .95rem; cursor: pointer; transition: transform .2s, box-shadow .2s; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79,195,247,.4); }
    .hero { text-align: center; padding: 70px 20px 30px; }
    .hero h1 { font-size: 2.2rem; margin-bottom: 10px; }
    .hero p { color: #999; margin-bottom: 24px; }
    .wrap { max-width: 960px; margin: auto; padding: 0 20px 50px; }
    #search { width: 100%; padding: 14px 18px; border-radius: 30px; border: 1px solid #222; background: rgba(15,15,15,.85); color: #fff; font-size: 1rem; outline: none; }
    #search:focus { border-color: #4fc3f7; }
    .cats { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 24px; justify-content: center; }
    .cat { padding: 8px 18px; border-radius: 20px; border: 1px solid #2a2a2a; background: rgba(20,20,20,.8); color: #ddd; cursor: pointer; font-size: .9rem; }
    .cat.active, .cat:hover { background: #4fc3f7; color: #000; border-color: #4fc3f7; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card { background: rgba(20,20,20,.78); backdrop-filter: blur(6px); padding: 18px; border-radius: 16px; border: 1px solid #222; display: flex; flex-direction: column; gap: 6px; transition: border-color .2s, transform .2s; }
    .card:hover { border-color: #4fc3f7; transform: translateY(-3px); }
    .card .icon { font-size: 1.8rem; }
    .card h3 { font-size: 1.05rem; color: #4fc3f7; word-break: break-word; }
    .card p { color: #999; font-size: .88rem; flex: 1; }
    .meta { font-size: .78rem; color: #666; }
    .card .btn { text-align: center; margin-top: 8px; }
    .empty { text-align: center; color: #777; padding: 40px 0; display: none; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
    .modal.show { display: flex; }
    .box { background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 16px; padding: 22px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; }
    .box input, .box textarea { padding: 12px; border-radius: 10px; border: 1px solid #222; background: #000; color: #fff; font-size: 1rem; outline: none; }
    .box input:focus, .box textarea:focus { border-color: #4fc3f7; }
    .row { display: flex; gap: 10px; }
    .row .btn { flex: 1; }
    .btn.gray { background: #222; color: #ddd; }
    footer { text-align: center; padding: 24px; color: #777; border-top: 1px solid #1c1c1c; }
    @media (max-width: 600px) { .hero h1 { font-size: 1.7rem; } }
  </style>
</head>
<body>
  <canvas id="bubbles"></canvas>

  <div class="content">
    <header>
      <div class="logo">📁 Tempat File Kebutuhan</div>
      <button class="btn" onclick="openModal()">Request File</button>
    </header>

    <div class="hero">
      <h1>Tempat File Kebutuhan</h1>
      <p>Cari dan download file yang kamu butuhkan, gratis.</p>
    </div>

    <div class="wrap">
      <input type="text" id="search" placeholder="🔍 Cari file...">
      <div class="cats" id="cats"></div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty">File tidak ditemukan 😕</div>
    </div>

    <footer>© <span id="year"></span> Tempat File Kebutuhan</footer>
  </div>

  <div class="modal" id="modal">
    <form class="box" id="reqForm">
      <h3>Request File</h3>
      <input type="text" id="rNama" placeholder="Nama kamu" required>
      <textarea id="rFile" rows="4" placeholder="File apa yang kamu butuhkan?" required></textarea>
      <div class="row">
        <button type="button" class="btn gray" onclick="closeModal()">Batal</button>
        <button type="submit" class="btn">Kirim</button>
      </div>
    </form>
  </div>

  <script>
    // ================== EDIT BAGIAN INI ==================
    const WA_NUMBER = "628123456789"; // nomor WhatsApp kamu (awali 62, tanpa +)

    // Tambah file di sini. "link" = lokasi file di repo GitHub kamu
    // Contoh: upload file ke folder "files" lalu tulis "files/nama-file.pdf"
    const files = [
      { nama: "Contoh Dokumen", kategori: "Dokumen", desc: "Deskripsi singkat file ini.", link: "files/contoh.pdf", ukuran: "1 MB" },
      { nama: "Contoh Aplikasi", kategori: "Aplikasi", desc: "Deskripsi singkat aplikasi ini.", link: "files/contoh.apk", ukuran: "25 MB" },
      { nama: "Contoh Gambar", kategori: "Gambar", desc: "Deskripsi singkat gambar ini.", link: "files/contoh.png", ukuran: "500 KB" },
      { nama: "Contoh Video", kategori: "Video", desc: "Deskripsi singkat video ini.", link: "files/contoh.mp4", ukuran: "40 MB" },
      { nama: "Contoh Lainnya", kategori: "Lainnya", desc: "Deskripsi singkat file ini.", link: "files/contoh.zip", ukuran: "5 MB" }
    ];
    const kategori = ["Semua", "Dokumen", "Aplikasi", "Gambar", "Video", "Lainnya"];
    // =====================================================

    const icons = { Dokumen: "📄", Aplikasi: "📦", Gambar: "🖼️", Video: "🎬", Lainnya: "📁" };
    let aktif = "Semua";

    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const search = document.getElementById("search");
    const catsEl = document.getElementById("cats");

    function renderCats() {
      catsEl.innerHTML = "";
      kategori.forEach(k => {
        const b = document.createElement("button");
        b.className = "cat" + (k === aktif ? " active" : "");
        b.textContent = k;
        b.onclick = () => { aktif = k; renderCats(); renderFiles(); };
        catsEl.appendChild(b);
      });
    }

    function renderFiles() {
      const q = search.value.toLowerCase();
      const hasil = files.filter(f =>
        (aktif === "Semua" || f.kategori === aktif) &&
        (f.nama.toLowerCase().includes(q) || f.desc.toLowerCase().includes(q))
      );
      grid.innerHTML = hasil.map(f => `
        <div class="card">
          <div class="icon">${icons[f.kategori] || "📁"}</div>
          <h3>${f.nama}</h3>
          <p>${f.desc}</p>
          <div class="meta">${f.kategori} • ${f.ukuran}</div>
          <a class="btn" href="${f.link}" download>⬇ Download</a>
        </div>`).join("");
      empty.style.display = hasil.length ? "none" : "block";
    }

    search.addEventListener("input", renderFiles);

    function openModal() { document.getElementById("modal").classList.add("show"); }
    function closeModal() { document.getElementById("modal").classList.remove("show"); }
    document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

    document.getElementById("reqForm").addEventListener("submit", e => {
      e.preventDefault();
      const nama = document.getElementById("rNama").value;
      const isi = document.getElementById("rFile").value;
      const teks = encodeURIComponent(`Halo, saya ${nama}. Request file: ${isi}`);
      window.open(`https://wa.me/${WA_NUMBER}?text=${teks}`, "_blank");
      e.target.reset();
      closeModal();
    });

    document.getElementById("year").textContent = new Date().getFullYear();
    renderCats();
    renderFiles();

    // Gelembung
    const canvas = document.getElementById("bubbles");
    const ctx = canvas.getContext("2d");
    let bubbles = [];
    function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
    resize();
    addEventListener("resize", resize);

    function createBubble(initial) {
      return {
        x: Math.random() * canvas.width,
        y: initial ? Math.random() * canvas.height : canvas.height + 40,
        r: Math.random() * 28 + 6,
        speed: Math.random() * 0.6 + 0.2,
        drift: Math.random() * 2 * Math.PI,
        alpha: Math.random() * 0.25 + 0.1
      };
    }
    const count = innerWidth < 600 ? 25 : 50;
    for (let i = 0; i < count; i++) bubbles.push(createBubble(true));

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      bubbles.forEach((b, i) => {
        b.y -= b.speed;
        b.drift += 0.01;
        b.x += Math.sin(b.drift) * 0.4;
        const g = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.1, b.x, b.y, b.r);
        g.addColorStop(0, `rgba(255,255,255,${b.alpha})`);
        g.addColorStop(0.6, `rgba(79,195,247,${b.alpha * 0.3})`);
        g.addColorStop(1, `rgba(79,195,247,${b.alpha * 0.1})`);
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = `rgba(79,195,247,${b.alpha})`;
        ctx.stroke();
        if (b.y + b.r < 0) bubbles[i] = createBubble(false);
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
